<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Geolocation</title>
</head>

<body>
    <h3> Nama : Jundi Al-Faruq Reksowardoyo</h3>
    <h3> NIM : 20240140100</h3>


    
    <p>
        Kota : 
        <span id="lokasi"></span> 

    </p>

    <p>
    Lokasi :
    <select id="pilihLokasi">
        <option value="jakarta">Jakarta</option>
        <option value="yogyakarta">Yogyakarta</option>
        <option value="bandung">Bandung</option>
        <option value="surabaya">Surabaya</option>
    </select>
    </p>

    <hr>

    <p>
        Koordinat :
        <span id="negara"></span>    
    </p>

    <script>
        const pilihLokasi = document.getElementById("pilihLokasi");

        function ambilLokasi(kota) {
            fetch(`/api/lokasi?kota=${kota}`)
                .then(response => response.json())
                .then(data => {
                    
                    console.log(data);

                    document.getElementById("lokasi").innerHTML = data.kota;

                    document.getElementById("negara").innerHTML = data.kordinat;

                })
            .catch(error => {

                console.error(error);

            });
}
ambilLokasi(pilihLokasi.value);

pilihLokasi.addEventListener("change", function() {
    ambilLokasi(this.value);
});
    </script>

</body>
</html>
